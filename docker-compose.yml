services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillbridge
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: skillbridge
    ports: ["5432:5432"]
    volumes: ["skillbridge_pg:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://skillbridge:skillbridge@db:5432/skillbridge
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    command: npm run dev
    environment: [NEXT_PUBLIC_API_URL=http://localhost:8000]
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  skillbridge_pg:
